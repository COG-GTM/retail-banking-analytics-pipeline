#!/bin/bash
# =============================================================================
# Spark Pipeline Configuration - Retail Banking Customer Analytics
# =============================================================================
# Additive, Spark-specific settings for the PySpark analytics layer. Sources the
# shared pipeline config first, then layers on the data-lake and Spark settings
# consumed by spark/config.py (all via environment variables, no secrets here).
# =============================================================================

_SPARK_CFG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

# Reuse shared references (RUN_DATE, LOG_DIR, RISK_SCORE_THRESHOLD, ...).
# shellcheck source=/dev/null
source "${_SPARK_CFG_DIR}/../config/pipeline_config.cfg"

# -- Data layer (replaces the connect_teradata LIBNAME references) -------------
# STGDB -> STAGING_PATH (ETL_STAGING_DB), DPDB -> DATA_PRODUCTS_PATH (DATA_PRODUCTS_DB)
export DATA_ROOT="${DATA_ROOT:-${_SPARK_CFG_DIR}/../data}"
export STAGING_PATH="${STAGING_PATH:-${DATA_ROOT}/02_bteq_staging}"
export DATA_PRODUCTS_PATH="${DATA_PRODUCTS_PATH:-${DATA_ROOT}/03_sas_data_products}"
export DATA_FORMAT="${DATA_FORMAT:-csv}"

# -- Spark session ------------------------------------------------------------
export SPARK_MASTER="${SPARK_MASTER:-local[*]}"
export SPARK_APP_NAME="${SPARK_APP_NAME:-retail_banking_analytics}"

# -- Analytics hyper-parameters (mirror the SAS PROC options) -----------------
export N_CLUSTERS="${N_CLUSTERS:-5}"          # PROC FASTCLUS maxclusters=5
export KMEANS_MAX_ITER="${KMEANS_MAX_ITER:-50}"
export KMEANS_TOL="${KMEANS_TOL:-0.001}"
export KMEANS_SEED="${KMEANS_SEED:-20240101}"
export RANK_GROUPS="${RANK_GROUPS:-100}"      # PROC RANK groups=100

# -- Data-quality gate --------------------------------------------------------
# SAS used min_rows=1000; override lower to run against the smaller committed
# sample data (e.g. PIPELINE_MIN_ROWS=1).
export PIPELINE_MIN_ROWS="${PIPELINE_MIN_ROWS:-1000}"
