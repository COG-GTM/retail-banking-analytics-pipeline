name: 'retail_banking_analytics'
version: '1.0.0'
config-version: 2

profile: 'retail_banking_analytics'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Run parameters previously defined in config/pipeline_config.cfg
vars:
  # LOOKBACK_MONTHS - transaction summary lookback window
  lookback_months: 12
  # RISK_SCORE_THRESHOLD - bureau score cut-off used by risk scoring
  risk_score_threshold: 700
  # Model versions stamped onto the data products (were SAS %let statements)
  txn_model_version: 'TXN_V2.1'
  segment_model_version: 'SEG_V3.2'
  risk_model_version: 'RISK_V4.0'
  master_model_version: 'MASTER_V1.5'
  # Mirror run results into the legacy audit table; dbt's run_results.json
  # remains the primary artifact. Set to false to skip the audit insert.
  enable_etl_run_log: true
  etl_run_log_relation: "{{ env_var('DBT_SCHEMA_STAGING', 'ETL_STAGING_DB') }}.ETL_RUN_LOG"

# Replaces the per-script ETL_RUN_LOG inserts the BTEQ jobs carried
on-run-end:
  - "{{ log_run_results(results) }}"

models:
  retail_banking_analytics:
    +materialized: table
    staging:
      # ETL_STAGING_DB - previously populated by the BTEQ scripts
      +schema: "{{ env_var('DBT_SCHEMA_STAGING', 'ETL_STAGING_DB') }}"
      +tags: ['staging']
    intermediate:
      +schema: "{{ env_var('DBT_SCHEMA_STAGING', 'ETL_STAGING_DB') }}"
      +tags: ['intermediate']
    marts:
      # DATA_PRODUCTS_DB - certified data products consumed downstream
      +schema: "{{ env_var('DBT_SCHEMA_MARTS', 'DATA_PRODUCTS_DB') }}"
      +tags: ['marts']

seeds:
  retail_banking_analytics:
    +schema: "{{ env_var('DBT_SCHEMA_STAGING', 'ETL_STAGING_DB') }}"
