name: 'retail_banking_analytics'
version: '1.0.0'
config-version: 2

profile: 'retail_banking_analytics'

model-paths: ['models']
macro-paths: ['macros']
test-paths: ['tests']
analysis-paths: ['analyses']
target-path: 'target'
clean-targets: ['target', 'dbt_packages']

vars:
  # Source databases, migrated from Teradata by TICKET-01.
  source_core_banking_database: 'CORE_BANKING_DB'
  source_core_banking_schema: 'PUBLIC'
  # Shared run-log relation (replacement for ETL_STAGING_DB.ETL_RUN_LOG).
  etl_run_log_relation: 'ETL_STAGING_DB.PUBLIC.ETL_RUN_LOG'

models:
  retail_banking_analytics:
    staging:
      +materialized: table
      +schema: staging
