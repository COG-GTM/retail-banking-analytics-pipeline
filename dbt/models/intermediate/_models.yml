version: 2

models:

  - name: int_daily_balance
    description: >
      End-of-day balance per account for the last three months, taken from the
      RUNNING_BALANCE of the last posted transaction of each day. Replaces the
      WRK_DAILY_BALANCE work table that bteq/03_stg_risk_factors.bteq created
      and dropped by hand; dbt rebuilds it as part of the DAG instead.
    columns:
      - name: CUSTOMER_ID
        description: Owning customer.
        data_tests:
          - not_null
      - name: ACCOUNT_ID
        description: Account the balance belongs to.
        data_tests:
          - not_null
      - name: TRANSACTION_DATE
        description: Balance date.
        data_tests:
          - not_null
      - name: EOD_BALANCE
        description: Running balance after the last posted transaction of the day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ACCOUNT_ID
              - TRANSACTION_DATE

  - name: int_payment_history
    description: >
      Payment counts per credit/loan account over the last 24 months, with
      on-time versus late classification against the account anniversary
      due-date proxy. Replaces the WRK_PAYMENT_HISTORY work table from
      bteq/03_stg_risk_factors.bteq.
    columns:
      - name: CUSTOMER_ID
        description: Owning customer.
        data_tests:
          - not_null
      - name: ACCOUNT_ID
        description: Credit or loan account.
        data_tests:
          - not_null
      - name: TOTAL_PAYMENTS
        description: Count of payment transactions in the window.
      - name: ONTIME_PAYMENTS
        description: Payments posted on or before the due-date proxy.
      - name: LATE_PAYMENTS
        description: Payments posted after the due-date proxy.
      - name: MONTHS_SINCE_LAST_LATE
        description: >
          Months since the most recent late payment, falling back to months
          since the account opened when there are none.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - CUSTOMER_ID
              - ACCOUNT_ID

  - name: int_customer_segment_features
    description: >
      Segmentation features for active customers plus mean/standard-deviation
      standardized copies of the six clustering inputs. Ports the feature
      engineering and PROC STDIZE steps of sas/01_sas_customer_segments.sas and
      is the documented input contract for the clustering step that runs outside
      dbt (see customer_segments).
    columns:
      - name: CUSTOMER_ID
        description: Active customer; primary index of the table.
        data_tests:
          - not_null
          - unique
      - name: PRODUCT_BREADTH
        description: Share of the four product types held, 0 to 1.
      - name: TENURE_GROUP
        description: Tenure bucket.
      - name: AGE_GROUP
        description: Generational bucket.
      - name: BALANCE_TIER
        description: Balance bucket.
      - name: DIGITAL_ADOPTION_SCORE
        description: Placeholder carried over from the SAS program; always 0.
      - name: LOG_BALANCE
        description: Natural log of total balance, floored at 1.
      - name: ACCT_RATIO
        description: Active accounts over total accounts.
      - name: STD_LOG_BALANCE
        description: Standardized LOG_BALANCE clustering input.
      - name: STD_TENURE_MONTHS
        description: Standardized tenure clustering input.
      - name: STD_CREDIT_UTILIZATION_PCT
        description: Standardized credit utilization clustering input.
      - name: STD_PRODUCT_BREADTH
        description: Standardized product breadth clustering input.
      - name: STD_ACCT_RATIO
        description: Standardized account ratio clustering input.
      - name: STD_AGE
        description: Standardized age clustering input.
