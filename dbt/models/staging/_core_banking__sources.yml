version: 2

sources:
  - name: core_banking
    description: >
      Snowflake landing of the operational core banking tables (migrated from
      Teradata CORE_BANKING_DB by TICKET-01). Database/schema are overridable
      via the source_core_banking_database / source_core_banking_schema vars so
      models can point at DEV/UAT/PROD without edits.
    database: "{{ var('source_core_banking_database', 'CORE_BANKING_DB') }}"
    schema: "{{ var('source_core_banking_schema', 'PUBLIC') }}"
    tables:
      - name: CUSTOMERS
      - name: ACCOUNTS
      - name: ADDRESSES
      - name: CUSTOMER_BUREAU_SCORES
        description: >
          External credit bureau score feed, joined as a simulated lookup by
          bteq/03_stg_risk_factors.bteq. It has no DDL in ddl/00_source_tables.sql;
          the columns used here (CUSTOMER_ID, EXTERNAL_CREDIT_SCORE, REPORT_DATE)
          are taken from the BTEQ script.
