version: 2

models:
  - name: stg_risk_factors
    description: >
      Risk feature vectors per customer (was ETL_STAGING_DB.STG_RISK_FACTORS,
      built by bteq/03_stg_risk_factors.bteq). One row per active or inactive
      customer, including customers with no transactions in any window.
    columns:
      - name: CUSTOMER_ID
        description: Core banking customer identifier; grain of the model.
        tests:
          - not_null
          - unique
      - name: ACCOUNT_OVERDRAFT_CNT
        description: Posted transactions leaving a negative running balance in the last 12 months.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: NSF_FEE_TOTAL
        description: Total NSF fee amount charged in the last 12 months.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: LARGE_WITHDRAWAL_CNT
        description: Count of single debits of $5,000 or more in the last 12 months.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: LARGE_WITHDRAWAL_AMT
        description: Total amount of those large debits.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: AVG_DAILY_BALANCE_30D
        description: Average end-of-day balance over the last 30 days (0 when no activity).
        tests:
          - not_null
      - name: AVG_DAILY_BALANCE_90D
        description: Average end-of-day balance over the last 90 days (0 when no activity).
        tests:
          - not_null
      - name: BALANCE_VOLATILITY
        description: Population standard deviation (STDDEV_POP) of end-of-day balances over 3 months.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: CREDIT_UTIL_RATIO
        description: Credit balance divided by credit limit across open credit accounts.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: PAYMENT_ONTIME_PCT
        description: Percentage of credit/loan payments posted by the due-date proxy; 100 when no payments.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: PAYMENT_LATE_CNT
        description: Count of late payments in the last 24 months.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: MONTHS_SINCE_LAST_LATE
        description: Months since the most recent late payment; 999 when the customer has no payment history.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: EXTERNAL_CREDIT_SCORE
        description: Most recent external bureau score; 0 when no bureau record exists.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 900
              inclusive: true
      - name: DEBIT_VELOCITY_7D
        description: Total debit amount over the last 7 days.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: DEBIT_VELOCITY_30D
        description: Total debit amount over the last 30 days.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: NEW_MERCHANT_CNT_30D
        description: Distinct merchants used in the last 30 days that the account never used before.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: INTERNATIONAL_TXN_CNT
        description: Transactions on the INTL channel in the last 6 months.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: HIGH_RISK_MERCHANT_CNT
        description: Transactions in high-risk merchant categories in the last 6 months.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: LOAD_TS
        description: Model build timestamp (was CURRENT_TIMESTAMP(6) in BTEQ).
        tests:
          - not_null
