version: 2

models:

  - name: transaction_analytics
    description: >
      Customer-level transaction behaviour for the current reporting period:
      volumes, cash flow, revenue contribution, digital adoption, spend
      percentile and spend anomaly flag. Replaces
      sas/02_sas_txn_analytics.sas. PROC RANK groups=100 is reimplemented as
      NTILE(100) - 1 and the PROC MEANS IQR outlier rule as PERCENTILE_CONT
      bounds over the whole customer population. The column contract is
      DATA_PRODUCTS_DB.TRANSACTION_ANALYTICS in ddl/02_data_product_tables.sql.
    data_tests:
      - min_row_count:
          arguments:
            min_rows: 1000
      - dbt_utils.expression_is_true:
          arguments:
            expression: "SPEND_PERCENTILE between 0 and 99"
    columns:
      - name: CUSTOMER_ID
        description: Customer surrogate key; primary index of the table.
        data_tests:
          - not_null
          - unique
      - name: REPORTING_PERIOD
        description: "Reporting month as YYYY-MM; the table is partitioned on it."
        data_tests:
          - not_null
      - name: TOTAL_ACCOUNTS
        description: Distinct accounts with activity in the lookback window.
      - name: ACTIVE_ACCOUNTS
        description: Accounts transacted on within the last 30 days.
      - name: TOTAL_TRANSACTIONS
        description: Posted transaction count across all accounts.
        data_tests:
          - not_null
      - name: TOTAL_DEBIT_AMT
        description: Absolute debit dollars.
      - name: TOTAL_CREDIT_AMT
        description: Credit dollars.
      - name: NET_CASH_FLOW
        description: Credits minus debits.
      - name: AVG_TRANSACTION_SIZE
        description: Mean dollar size across debit and credit activity.
      - name: MONTHLY_SPEND_TREND
        description: "UP, DOWN or STABLE, from net cash flow versus 5x average size."
        data_tests:
          - accepted_values:
              arguments:
                values: ['UP', 'DOWN', 'STABLE']
      - name: SPEND_PERCENTILE
        description: "Debit-spend percentile bucket, 0-99 (PROC RANK groups=100 equivalent)."
      - name: TOP_SPEND_CATEGORY
        description: Highest-spend merchant category across the customer's accounts.
      - name: DIGITAL_TXN_PCT
        description: Transaction-weighted share of WEB and MOBILE activity.
      - name: FEE_INCOME
        description: Fee dollars collected.
      - name: INTEREST_INCOME
        description: Interest proxy, 2% of debit volume.
      - name: REVENUE_CONTRIBUTION
        description: Fee income plus interest income.
      - name: ANOMALY_FLAG
        description: "Y when debit spend exceeds median + 3 x IQR of the population."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: MODEL_VERSION
        description: Version stamp from the txn_model_version var.
      - name: EFFECTIVE_DATE
        description: Date the row was produced.
      - name: LOAD_TS
        description: Timestamp the row was materialized.

  - name: customer_segments
    description: >
      Behavioural customer segmentation data product for active customers.
      Deterministic logic from sas/01_sas_customer_segments.sas is ported here
      and in int_customer_segment_features: product breadth, tenure/age/balance
      groupings, LOG_BALANCE, ACCT_RATIO, the LTV and engagement heuristics and
      the cross-sell / upsell / retention-risk flags.

      EXTERNAL SCORING BOUNDARY - the k-means step (SAS PROC FASTCLUS) has no
      dbt SQL equivalent, so SEGMENT_ID, SEGMENT_NAME and SUBSEGMENT_ID are not
      computed by this model. They are read from the customer_segment_assignments
      hand-off table, which is populated either in-database by
      `dbt run-operation run_td_kmeans_segments` (Teradata TD_KMeans /
      TD_KMeansPredict, see macros/run_td_kmeans_segments.sql) or by an external
      scoring job whose output is loaded with `dbt seed`. Customers with no
      assignment are labelled UNCLASSIFIED with a NULL SEGMENT_ID, so the DAG
      runs green before the first scoring pass; the row-level defaults, every
      other column and the run order are unchanged from the SAS program.

      The column contract is DATA_PRODUCTS_DB.CUSTOMER_SEGMENTS in
      ddl/02_data_product_tables.sql.
    data_tests:
      - min_row_count:
          arguments:
            min_rows: 1000
      - dbt_utils.expression_is_true:
          arguments:
            expression: "LIFETIME_VALUE_SCORE >= 0"
    columns:
      - name: CUSTOMER_ID
        description: Customer surrogate key; primary index of the table.
        data_tests:
          - not_null
          - unique
      - name: SEGMENT_NAME
        description: "Cluster label from the scoring job, or UNCLASSIFIED when unscored."
        data_tests:
          - not_null
      - name: SEGMENT_ID
        description: Cluster number from the scoring job; NULL when unscored.
      - name: SUBSEGMENT_ID
        description: Reserved for sub-segmentation; 0 today.
      - name: LIFETIME_VALUE_SCORE
        description: "Heuristic: LOG_BALANCE x TENURE_MONTHS x PRODUCT_BREADTH x 10."
      - name: ENGAGEMENT_SCORE
        description: Active accounts as a percentage of all accounts.
      - name: DIGITAL_ADOPTION_SCORE
        description: Placeholder carried over from the SAS program; always 0.
      - name: PRODUCT_BREADTH_INDEX
        description: Share of the four product types held, as a percentage.
      - name: TENURE_GROUP
        description: "NEW (<1yr), DEVELOPING (1-3yr), ESTABLISHED (3-7yr) or LOYAL (7yr+)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['NEW (<1yr)', 'DEVELOPING (1-3yr)', 'ESTABLISHED (3-7yr)', 'LOYAL (7yr+)']
      - name: AGE_GROUP
        description: "GEN_Z, MILLENNIAL, GEN_X, BOOMER or SILENT."
        data_tests:
          - accepted_values:
              arguments:
                values: ['GEN_Z', 'MILLENNIAL', 'GEN_X', 'BOOMER', 'SILENT']
      - name: BALANCE_TIER
        description: "LOW, MODERATE, AFFLUENT or HIGH_NET_WORTH."
        data_tests:
          - accepted_values:
              arguments:
                values: ['LOW', 'MODERATE', 'AFFLUENT', 'HIGH_NET_WORTH']
      - name: CHANNEL_PREFERENCE
        description: Placeholder carried over from the SAS program; empty string.
      - name: CROSS_SELL_FLAG
        description: "Y when product breadth is below 0.5 and account ratio is at least 0.75."
      - name: UPSELL_FLAG
        description: "Y for MODERATE balance customers past their first year."
      - name: RETENTION_RISK_FLAG
        description: "Y when account ratio is below 0.5 despite 60+ months of tenure."
      - name: MODEL_VERSION
        description: Version from the scoring job, falling back to the segment_model_version var.
      - name: EFFECTIVE_DATE
        description: Date the row was produced.
      - name: LOAD_TS
        description: Timestamp the row was materialized.

  - name: customer_risk_scores
    description: >
      Composite customer risk scoring data product. Deterministic logic from
      sas/03_sas_risk_scoring.sas is ported here and in
      int_customer_risk_features: the five risk components, the weighted
      composite score, RISK_TIER bucketing, the top-two risk drivers and the
      watch-list / review-required flags.

      EXTERNAL SCORING BOUNDARY - PROC LOGISTIC has no dbt SQL equivalent, so
      PROBABILITY_OF_DEFAULT is not computed by this model. It is read from the
      customer_default_probabilities hand-off table, populated either
      in-database by `dbt run-operation run_td_glm_default_scores` (Teradata
      TD_GLM / TD_GLMPredict, see macros/run_td_glm_default_scores.sql) or by an
      external scoring job whose output is loaded with `dbt seed`. Unscored
      customers get a probability of 0, matching the SAS
      coalesce(PROB_DEFAULT, 0); every other column is unchanged from the SAS
      program.

      The column contract is DATA_PRODUCTS_DB.CUSTOMER_RISK_SCORES in
      ddl/02_data_product_tables.sql.
    data_tests:
      - min_row_count:
          arguments:
            min_rows: 1000
      - dbt_utils.expression_is_true:
          arguments:
            expression: "COMPOSITE_RISK_SCORE between 0 and 100"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "PROBABILITY_OF_DEFAULT between 0 and 1"
    columns:
      - name: CUSTOMER_ID
        description: Customer surrogate key; primary index of the table.
        data_tests:
          - not_null
          - unique
      - name: COMPOSITE_RISK_SCORE
        description: Weighted 0-100 risk score; higher means riskier.
        data_tests:
          - not_null
      - name: RISK_TIER
        description: "LOW, MODERATE, ELEVATED, HIGH or CRITICAL."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LOW', 'MODERATE', 'ELEVATED', 'HIGH', 'CRITICAL']
      - name: PROBABILITY_OF_DEFAULT
        description: Modelled default probability from the scoring boundary; 0 when unscored.
      - name: CREDIT_RISK_COMPONENT
        description: Inverse of the normalized bureau score, clamped to 0-100.
      - name: BEHAVIOUR_RISK_COMPONENT
        description: Inverse of the on-time payment percentage, clamped to 0-100.
      - name: VELOCITY_RISK_COMPONENT
        description: Debit velocity spike scaled to 0-100.
      - name: BUREAU_SCORE_COMPONENT
        description: Normalized bureau score, clamped to 0-100.
      - name: PAYMENT_HISTORY_COMPONENT
        description: On-time payment percentage, clamped to 0-100.
      - name: PRIMARY_RISK_DRIVER
        description: Highest scoring risk component.
      - name: SECONDARY_RISK_DRIVER
        description: Second highest scoring risk component.
      - name: SCORE_DELTA_30D
        description: Placeholder carried over from the SAS program; always 0.
      - name: WATCH_LIST_FLAG
        description: "Y for CRITICAL customers with a default probability above 0.5."
      - name: REVIEW_REQUIRED_FLAG
        description: "Y when the composite score is 60+ and velocity ratio exceeds 2."
      - name: MODEL_VERSION
        description: Version from the scoring job, falling back to the risk_model_version var.
      - name: EFFECTIVE_DATE
        description: Date the row was produced.
      - name: LOAD_TS
        description: Timestamp the row was materialized.

  - name: customer_master_profile
    description: >
      Golden record: one row per active customer combining base attributes with
      the segment, transaction and risk data products. Replaces
      sas/04_sas_data_products.sas, whose four-way data-step MERGE keyed on
      CUSTOMER_ID with `if _base` becomes LEFT JOINs from stg_customer_360
      filtered to CUSTOMER_STATUS = 'A'. Missing-source defaults are preserved:
      UNCLASSIFIED and zeros for unsegmented customers, zeros and an empty
      category for customers with no current-period transactions, and UNKNOWN
      with a NULL score for unscored customers. The ref() dependencies make dbt
      build this model after all three marts. The column contract is
      DATA_PRODUCTS_DB.CUSTOMER_MASTER_PROFILE in ddl/02_data_product_tables.sql.
    data_tests:
      - min_row_count:
          arguments:
            min_rows: 1000
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ACTIVE_ACCOUNTS <= TOTAL_ACCOUNTS"
    columns:
      - name: CUSTOMER_ID
        description: Customer surrogate key; primary index of the table.
        data_tests:
          - not_null
          - unique
      - name: FULL_NAME
        description: First and last name concatenated.
        data_tests:
          - not_null
      - name: AGE
        description: Age in whole years.
      - name: STATE_CODE
        description: State of the most recent HOME address.
      - name: CUSTOMER_SINCE
        description: Relationship start date.
      - name: TENURE_MONTHS
        description: Whole months since the relationship started.
      - name: CUSTOMER_STATUS
        description: Always 'A'; the profile covers active customers only.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A']
      - name: SEGMENT_NAME
        description: "Segment label, or UNCLASSIFIED when the customer has no segment row."
      - name: LIFETIME_VALUE_SCORE
        description: LTV heuristic from customer_segments; 0 when unsegmented.
      - name: ENGAGEMENT_SCORE
        description: Engagement heuristic from customer_segments; 0 when unsegmented.
      - name: TOTAL_ACCOUNTS
        description: Accounts held by the customer.
      - name: ACTIVE_ACCOUNTS
        description: Open accounts held by the customer.
      - name: TOTAL_BALANCE
        description: Sum of balances across accounts.
      - name: TOTAL_CREDIT_LIMIT
        description: Sum of credit limits across credit accounts.
      - name: CREDIT_UTILIZATION_PCT
        description: Credit balance over credit limit, as a percentage.
      - name: MONTHLY_TRANSACTIONS
        description: Current-period transaction count; 0 when there is no activity.
      - name: MONTHLY_SPEND
        description: Current-period debit dollars; 0 when there is no activity.
      - name: NET_CASH_FLOW
        description: Current-period credits minus debits; 0 when there is no activity.
      - name: TOP_SPEND_CATEGORY
        description: Highest-spend merchant category; empty when there is no activity.
      - name: DIGITAL_TXN_PCT
        description: Digital share of transactions; 0 when there is no activity.
      - name: COMPOSITE_RISK_SCORE
        description: Composite risk score; NULL when the customer is unscored.
      - name: RISK_TIER
        description: "Risk tier, or UNKNOWN when the customer is unscored."
        data_tests:
          - accepted_values:
              arguments:
                values: ['LOW', 'MODERATE', 'ELEVATED', 'HIGH', 'CRITICAL', 'UNKNOWN']
      - name: PROBABILITY_OF_DEFAULT
        description: Modelled default probability; NULL when the customer is unscored.
      - name: WATCH_LIST_FLAG
        description: "Y when the customer is on the risk watch list."
      - name: CROSS_SELL_FLAG
        description: "Y when the customer is cross-sell eligible."
      - name: UPSELL_FLAG
        description: "Y when the customer is upsell eligible."
      - name: RETENTION_RISK_FLAG
        description: "Y when the customer is a retention risk."
      - name: MODEL_VERSION
        description: Version stamp from the master_model_version var.
      - name: EFFECTIVE_DATE
        description: Date the row was produced.
      - name: LOAD_TS
        description: Timestamp the row was materialized.
