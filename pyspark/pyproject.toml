[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbap-pyspark"
version = "1.0.0"
description = "PySpark re-implementation of the retail banking analytics ETL pipeline (BTEQ + SAS)"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "numpy==1.26.4",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "chispa==0.10.1",
]

[tool.setuptools]
packages = ["common", "jobs", "orchestration"]

# Run from the pyspark/ directory:  cd pyspark && pytest
# pythonpath="." exposes common/jobs/orchestration as top-level packages while
# keeping the real `pyspark` library resolvable (the dir has no pyspark/ subdir).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: pure transform unit tests",
    "functional: per-job tests on curated fixtures (schema/contract)",
    "regression: parity vs legacy expected outputs",
    "nonfunctional: validation, audit, config, abort-on-failure",
    "performance: scaled synthetic data + runtime SLAs (slow)",
    "e2e: full DAG end-to-end",
    "slow: long-running tests",
]
# Performance tier is slow + scale-dependent; deselected by default. Run it
# explicitly with `pytest -m performance` (CLI -m overrides this default).
addopts = "-ra -m 'not performance'"

[tool.coverage.run]
source = ["common", "jobs", "orchestration"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
