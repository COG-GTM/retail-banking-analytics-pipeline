name: credential-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for credential literals
        run: ./scripts/scan_for_credentials.sh

      - name: Shell syntax check
        run: |
          for f in $(git ls-files '*.sh' 'config/*.cfg'); do
            bash -n "$f"
          done

      - name: Validate Synapse linked service JSON
        run: |
          for f in $(git ls-files 'synapse/**/*.json'); do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Compile Python helpers
        run: python3 -m compileall -q snowflake/connection
