name: synapse-python-ci

on:
  push:
    paths:
      - 'synapse/**'
      - '.github/workflows/synapse-python-ci.yml'
  pull_request:
    paths:
      - 'synapse/**'
      - '.github/workflows/synapse-python-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q
