name: Synapse orchestration

on:
  push:
    branches: [main]
    paths:
      - "synapse/**"
      - "scripts/*_synapse*.py"
      - ".github/workflows/synapse-ci.yml"
  pull_request:
    paths:
      - "synapse/**"
      - "scripts/*_synapse*.py"
      - ".github/workflows/synapse-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Synapse artifacts
        run: python scripts/validate_synapse_artifacts.py
      - name: Render deployment for every environment
        run: |
          for env in dev uat prod; do
            python scripts/deploy_synapse.py --environment "${env}" --dry-run
          done

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, uat, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Synapse artifacts
        run: python scripts/deploy_synapse.py --environment ${{ matrix.environment }}
