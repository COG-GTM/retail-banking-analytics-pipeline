# Databricks Asset Bundle for the retail banking analytics pipeline.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run retail_banking_analytics_pipeline -t dev
#
# The job definition mirrors workflows/pipeline_job.json; deploy whichever fits
# your delivery model (bundle for CI/CD, raw JSON for `databricks jobs create`).
bundle:
  name: retail_banking_analytics

variables:
  catalog:
    description: Unity Catalog holding the medallion schemas.
    default: retail_banking
  secret_scope:
    description: Databricks secret scope for the optional Teradata JDBC pull.
    default: retail-banking-analytics
  node_type_id:
    description: Worker node type for the job cluster.
    default: Standard_DS3_v2

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_banking_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_banking

resources:
  jobs:
    retail_banking_analytics_pipeline:
      name: retail_banking_analytics_pipeline
      description: >-
        Retail banking medallion pipeline. Replaces orchestration/run_full_pipeline.sh:
        bronze ingest -> silver staging (was BTEQ) -> gold analytics (was SAS) ->
        post-run validation (was the envsubst BTEQ row-count block).
      tags:
        domain: retail_banking
        migrated_from: teradata_bteq_sas94
      max_concurrent_runs: 1
      timeout_seconds: 14400

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: bronze
        - name: silver_schema
          default: silver
        - name: gold_schema
          default: gold
        - name: ops_schema
          default: ops
        # Empty run_date -> current_date; set for a deterministic backfill.
        - name: run_date
          default: ""
        - name: lookback_months
          default: "12"
        - name: risk_score_threshold
          default: "700"
        - name: source_format
          default: csv
        - name: source_data_path
          default: ""
        - name: reference_data_path
          default: ""
        - name: secret_scope
          default: ${var.secret_scope}
        # Equivalents of run_full_pipeline.sh --skip-bteq / --skip-sas
        - name: skip_bronze
          default: "false"
        - name: skip_silver
          default: "false"
        - name: skip_gold
          default: "false"
        - name: skip_bteq
          default: "false"
        - name: skip_sas
          default: "false"
        - name: table_format
          default: delta
        - name: optimize_tables
          default: "true"
        - name: write_mode
          default: overwrite
        - name: min_rows
          default: "1"

      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_id}
            num_workers: 2
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      tasks:
        - task_key: bronze_ingest
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/bronze/00_ingest_source_tables.py

        - task_key: silver_stg_customer_360
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/silver/01_stg_customer_360.py

        - task_key: silver_stg_txn_summary
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/silver/02_stg_txn_summary.py

        - task_key: silver_stg_risk_factors
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/silver/03_stg_risk_factors.py

        - task_key: gold_customer_segments
          depends_on:
            - task_key: silver_stg_customer_360
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/gold/01_customer_segments.py

        - task_key: gold_txn_analytics
          depends_on:
            - task_key: silver_stg_customer_360
            - task_key: silver_stg_txn_summary
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/gold/02_txn_analytics.py

        - task_key: gold_risk_scoring
          depends_on:
            - task_key: silver_stg_customer_360
            - task_key: silver_stg_risk_factors
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/gold/03_risk_scoring.py

        # The golden record needs all three upstream products.
        - task_key: gold_data_products
          depends_on:
            - task_key: gold_customer_segments
            - task_key: gold_txn_analytics
            - task_key: gold_risk_scoring
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/gold/04_data_products.py

        - task_key: post_run_validation
          depends_on:
            - task_key: gold_data_products
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ./notebooks/validation/99_validate_data_products.py
