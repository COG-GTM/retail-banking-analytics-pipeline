line-length = 100
target-version = "py310"

# Injected by the Databricks runtime into every notebook.
builtins = ["spark", "dbutils", "display"]

[lint.per-file-ignores]
# Notebooks bootstrap sys.path before importing `shared`, and their `# MAGIC`
# markdown cells contain mapping tables that cannot be wrapped.
"notebooks/**" = ["E402", "E501"]
"setup/**" = ["E402"]
