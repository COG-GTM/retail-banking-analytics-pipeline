line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "T20"]

[lint.isort]
known-first-party = ["shared", "conftest"]

[lint.per-file-ignores]
# Notebook cells insert the package root on sys.path before importing shared
# helpers, so imports cannot all sit at the top of the file. E501 is off because
# the `# MAGIC |` markdown mapping tables have to stay on a single line.
"notebooks/**" = ["E402", "E501"]
"tests/conftest.py" = ["E402"]
