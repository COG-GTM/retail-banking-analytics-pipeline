[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-banking-databricks"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "scikit-learn",
    "mlflow-skinny",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "delta-spark==3.2.0",
    "pandas",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["BLE001", "E402", "F821", "I001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
