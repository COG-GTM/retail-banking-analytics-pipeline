resources:
  jobs:
    retail_banking_pipeline:
      name: retail_banking_pipeline
      parameters:
        - name: CATALOG
          default: ${var.catalog}
        - name: SOURCE_PATH
          default: ${var.source_path}
        - name: MLFLOW_EXPERIMENT
          default: ${var.mlflow_experiment}
        - name: DQ_MIN_ROWS
          default: ${var.dq_min_rows}
        - name: INGEST_MODE
          default: batch
        - name: LOOKBACK_MONTHS
          default: "12"
        - name: RISK_SCORE_THRESHOLD
          default: "700"
        - name: RUN_DATE
          default: "{{job.start_time.iso_date}}"
        - name: SKIP_SILVER
          default: "false"
        - name: SKIP_GOLD
          default: "false"
        - name: DRY_RUN
          default: "false"
      # schedule:
      #   quartz_cron_expression: "0 0 5 * * ?"
      #   timezone_id: UTC
      email_notifications:
        on_failure:
          - placeholder@example.com
      job_clusters:
        - job_cluster_key: retail_banking_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            data_security_mode: SINGLE_USER
            autoscale:
              min_workers: 1
              max_workers: 2
            node_type_id: Standard_DS3_v2
      tasks:
        - task_key: bronze_ingest
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/00_bronze_ingest.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              source_path: "{{job.parameters.SOURCE_PATH}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              ingest_mode: "{{job.parameters.INGEST_MODE}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: stg_customer_360
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/01_silver_stg_customer_360.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              source_path: "{{job.parameters.SOURCE_PATH}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: stg_txn_summary
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/02_silver_stg_txn_summary.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              source_path: "{{job.parameters.SOURCE_PATH}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: stg_risk_factors
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/03_silver_stg_risk_factors.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              source_path: "{{job.parameters.SOURCE_PATH}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: customer_segments
          depends_on:
            - task_key: stg_customer_360
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/04_gold_customer_segments.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: transaction_analytics
          depends_on:
            - task_key: stg_txn_summary
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/05_gold_transaction_analytics.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: customer_risk_scores
          depends_on:
            - task_key: stg_risk_factors
            - task_key: stg_customer_360
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/06_gold_customer_risk_scores.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: customer_master_profile
          depends_on:
            - task_key: customer_segments
            - task_key: transaction_analytics
            - task_key: customer_risk_scores
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/07_gold_customer_master_profile.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              lookback_months: "{{job.parameters.LOOKBACK_MONTHS}}"
              risk_score_threshold: "{{job.parameters.RISK_SCORE_THRESHOLD}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              skip_silver: "{{job.parameters.SKIP_SILVER}}"
              skip_gold: "{{job.parameters.SKIP_GOLD}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
        - task_key: post_run_validation
          depends_on:
            - task_key: customer_master_profile
          job_cluster_key: retail_banking_cluster
          libraries:
            - pypi:
                package: scikit-learn
            - pypi:
                package: mlflow
          notebook_task:
            notebook_path: ../notebooks/99_post_run_validation.py
            base_parameters:
              catalog: "{{job.parameters.CATALOG}}"
              mlflow_experiment: "{{job.parameters.MLFLOW_EXPERIMENT}}"
              dq_min_rows: "{{job.parameters.DQ_MIN_ROWS}}"
              run_date: "{{job.parameters.RUN_DATE}}"
              dry_run: "{{job.parameters.DRY_RUN}}"
