#!/bin/bash
# =============================================================================
# Pipeline Configuration - Retail Banking Customer Analytics
# =============================================================================
# Environment: DEV | UAT | PROD
# Last Updated: 2026-04-10
# =============================================================================

# -- Teradata Connection -------------------------------------------------------
export TD_SERVER="tdprod.corp.bankdemo.com"
export TD_USERNAME="${TD_USERNAME:-svc_etl_pipeline}"
export TD_LOGMECH="LDAP"
# Space-separated allowlist of Teradata hosts a run may log on to.
export TD_SERVER_ALLOWLIST="tdprod.corp.bankdemo.com tduat.corp.bankdemo.com tddev.corp.bankdemo.com"
# Variables that envsubst is permitted to expand inside BTEQ scripts.
export BTEQ_SUBST_VARS='${TD_SERVER} ${TD_USERNAME} ${LOOKBACK_MONTHS}'

# -- Database References -------------------------------------------------------
export DB_CORE="CORE_BANKING_DB"          # Operational customer/account data
export DB_TXN="TXN_PROCESSING_DB"         # Transaction processing tables
export DB_STG="ETL_STAGING_DB"            # BTEQ staging/intermediate tables
export DB_DP="DATA_PRODUCTS_DB"           # Final certified data products

# -- SAS Configuration ---------------------------------------------------------
export SAS_HOME="/opt/SASHome/SASFoundation/9.4"
export SAS_CONFIG="/opt/SASHome/SASConfig/Lev1"
export SAS_BATCH="${SAS_HOME}/sas"
export SAS_AUTOEXEC="/opt/SASHome/SASConfig/Lev1/autoexec.sas"

# -- Path Configuration --------------------------------------------------------
export PIPELINE_HOME="/opt/etl/retail_banking_analytics"
export BTEQ_DIR="${PIPELINE_HOME}/bteq"
export SAS_DIR="${PIPELINE_HOME}/sas"
export LOG_DIR="${PIPELINE_HOME}/logs"
export ARCHIVE_DIR="${PIPELINE_HOME}/archive"

# -- Run Parameters ------------------------------------------------------------
export RUN_DATE=$(date +%Y%m%d)
export RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
export LOOKBACK_MONTHS=12
export RISK_SCORE_THRESHOLD=700

# -- Logging -------------------------------------------------------------------
export LOG_LEVEL="INFO"   # DEBUG | INFO | WARN | ERROR

# -- Validation ----------------------------------------------------------------
# Values above reach Teradata via envsubst into .LOGON directives and SQL text,
# so anything that can be overridden from the environment is checked here.
validate_pipeline_config() {
    local allowed=0 host
    for host in ${TD_SERVER_ALLOWLIST}; do
        [ "${TD_SERVER}" = "${host}" ] && allowed=1
    done
    if [ "${allowed}" -ne 1 ]; then
        echo "CONFIG ERROR: TD_SERVER '${TD_SERVER}' is not in TD_SERVER_ALLOWLIST" >&2
        return 1
    fi
    if ! [[ "${TD_USERNAME}" =~ ^[A-Za-z][A-Za-z0-9_]{0,29}$ ]]; then
        echo "CONFIG ERROR: TD_USERNAME must be 1-30 alphanumeric/underscore characters" >&2
        return 1
    fi
    if ! [[ "${LOOKBACK_MONTHS}" =~ ^[0-9]{1,3}$ ]] \
        || [ "${LOOKBACK_MONTHS}" -lt 1 ] || [ "${LOOKBACK_MONTHS}" -gt 120 ]; then
        echo "CONFIG ERROR: LOOKBACK_MONTHS must be an integer between 1 and 120" >&2
        return 1
    fi
    if ! [[ "${RISK_SCORE_THRESHOLD}" =~ ^[0-9]{1,4}$ ]]; then
        echo "CONFIG ERROR: RISK_SCORE_THRESHOLD must be a non-negative integer" >&2
        return 1
    fi
    return 0
}

validate_pipeline_config || exit 1
