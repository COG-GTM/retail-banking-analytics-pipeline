#!/bin/bash
# =============================================================================
# Pipeline Configuration - Retail Banking Customer Analytics
# =============================================================================
# Environment: DEV | UAT | PROD
# Last Updated: 2026-04-10
# =============================================================================

# -- Teradata Connection -------------------------------------------------------
export TD_SERVER="tdprod.corp.bankdemo.com"
export TD_USERNAME="${TD_USERNAME:-svc_etl_pipeline}"
export TD_LOGMECH="LDAP"

# -- Database References -------------------------------------------------------
export DB_CORE="CORE_BANKING_DB"          # Operational customer/account data
export DB_TXN="TXN_PROCESSING_DB"         # Transaction processing tables
export DB_STG="ETL_STAGING_DB"            # BTEQ staging/intermediate tables
export DB_DP="DATA_PRODUCTS_DB"           # Final certified data products

# -- SAS Configuration ---------------------------------------------------------
export SAS_HOME="/opt/SASHome/SASFoundation/9.4"
export SAS_CONFIG="/opt/SASHome/SASConfig/Lev1"
export SAS_BATCH="${SAS_HOME}/sas"
export SAS_AUTOEXEC="/opt/SASHome/SASConfig/Lev1/autoexec.sas"

# -- Path Configuration --------------------------------------------------------
export PIPELINE_HOME="/opt/etl/retail_banking_analytics"
export BTEQ_DIR="${PIPELINE_HOME}/bteq"
export SAS_DIR="${PIPELINE_HOME}/sas"
export LOG_DIR="${PIPELINE_HOME}/logs"
export ARCHIVE_DIR="${PIPELINE_HOME}/archive"

# -- Run Parameters ------------------------------------------------------------
export RUN_DATE=$(date +%Y%m%d)
export RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
export LOOKBACK_MONTHS=12
export RISK_SCORE_THRESHOLD=700

# -- Logging -------------------------------------------------------------------
export LOG_LEVEL="INFO"   # DEBUG | INFO | WARN | ERROR

# -- Parameter Validation ------------------------------------------------------
# Values below are interpolated into BTEQ command streams. Restrict them to a
# strict character set so a value can never introduce extra BTEQ lines or
# dot-commands (e.g. ".OS") into the script.
export TD_ALLOWED_SERVERS="tdprod.corp.bankdemo.com tduat.corp.bankdemo.com tddev.corp.bankdemo.com"

# Variables that BTEQ scripts are permitted to reference via envsubst.
export BTEQ_SUBST_VARS='${TD_SERVER} ${TD_USERNAME} ${LOOKBACK_MONTHS}'

validate_pipeline_params() {
    local server_ok=0 s
    for s in ${TD_ALLOWED_SERVERS}; do
        [ "${TD_SERVER}" = "${s}" ] && server_ok=1
    done
    if [ "${server_ok}" -ne 1 ]; then
        echo "ERROR: TD_SERVER '${TD_SERVER}' is not in TD_ALLOWED_SERVERS" >&2
        return 1
    fi
    if ! [[ "${TD_USERNAME}" =~ ^[A-Za-z0-9_]{1,128}$ ]]; then
        echo "ERROR: TD_USERNAME must match ^[A-Za-z0-9_]{1,128}\$" >&2
        return 1
    fi
    if ! [[ "${LOOKBACK_MONTHS}" =~ ^[0-9]{1,3}$ ]]; then
        echo "ERROR: LOOKBACK_MONTHS must be a positive integer" >&2
        return 1
    fi
    if ! [[ "${RISK_SCORE_THRESHOLD}" =~ ^[0-9]{1,4}$ ]]; then
        echo "ERROR: RISK_SCORE_THRESHOLD must be a positive integer" >&2
        return 1
    fi
    return 0
}

validate_pipeline_params || exit 1
