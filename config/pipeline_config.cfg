#!/bin/bash
# =============================================================================
# Pipeline Configuration - Retail Banking Customer Analytics (Spark / Delta)
# =============================================================================
# Environment: DEV | UAT | PROD
# Storage/compute layer migrated from Teradata to Apache Spark + Delta Lake.
# Every value can be overridden by exporting it in the environment before the
# pipeline runs. No secrets are stored here; supply credentials (e.g. object
# store keys) via the environment / secret manager of the target platform.
# =============================================================================

# -- Spark Runtime ------------------------------------------------------------
export SPARK_SUBMIT="${SPARK_SUBMIT:-spark-submit}"
export SPARK_MASTER="${SPARK_MASTER:-local[*]}"          # e.g. yarn, k8s://..., spark://host:7077
export SPARK_DEPLOY_MODE="${SPARK_DEPLOY_MODE:-client}"  # client | cluster
export SPARK_APP_NAME="${SPARK_APP_NAME:-retail_banking_analytics}"
# Delta Lake runtime package (pin to match the cluster's Spark/Scala version).
export SPARK_DELTA_PACKAGE="${SPARK_DELTA_PACKAGE:-io.delta:delta-spark_2.12:3.2.0}"
# Optional extra spark-submit --conf args, space separated (e.g.
#   --conf spark.executor.memory=4g --conf spark.sql.shuffle.partitions=200)
export SPARK_EXTRA_CONF="${SPARK_EXTRA_CONF:-}"

# -- Catalog / Warehouse ------------------------------------------------------
# Where Delta tables live. Use a local path for dev or an object-store URI
# (s3a://..., abfss://..., gs://...) for UAT/PROD.
export SPARK_CATALOG="${SPARK_CATALOG:-spark_catalog}"
export WAREHOUSE_LOCATION="${WAREHOUSE_LOCATION:-/opt/etl/retail_banking_analytics/warehouse}"

# -- Database (Spark schema) References ---------------------------------------
export DB_CORE="${DB_CORE:-CORE_BANKING_DB}"    # Operational customer/account data (source)
export DB_TXN="${DB_TXN:-TXN_PROCESSING_DB}"    # Transaction processing tables (source)
export DB_STG="${DB_STG:-ETL_STAGING_DB}"       # Spark staging/intermediate tables
export DB_DP="${DB_DP:-DATA_PRODUCTS_DB}"       # Final certified data products

# -- Path Configuration -------------------------------------------------------
export PIPELINE_HOME="${PIPELINE_HOME:-/opt/etl/retail_banking_analytics}"
export LOG_DIR="${LOG_DIR:-${PIPELINE_HOME}/logs}"
export ARCHIVE_DIR="${ARCHIVE_DIR:-${PIPELINE_HOME}/archive}"

# -- Run Parameters -----------------------------------------------------------
export RUN_DATE=$(date +%Y%m%d)
export RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
export LOOKBACK_MONTHS="${LOOKBACK_MONTHS:-12}"
export RISK_SCORE_THRESHOLD="${RISK_SCORE_THRESHOLD:-700}"

# -- Logging ------------------------------------------------------------------
export LOG_LEVEL="${LOG_LEVEL:-INFO}"   # DEBUG | INFO | WARN | ERROR
