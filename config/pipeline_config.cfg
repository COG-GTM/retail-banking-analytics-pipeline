# =============================================================================
# Pipeline Configuration - Retail Banking Customer Analytics
# =============================================================================
# Environment: DEV | UAT | PROD
# Last Updated: 2026-09-09
#
# This file is DATA, not a shell script. It is parsed line-by-line by
# config/load_pipeline_config.sh as KEY=VALUE pairs: no variable expansion,
# no command substitution, and only allowlisted keys are accepted. Every value
# is validated before use. Derived paths (SAS_BATCH, BTEQ_DIR, SAS_DIR,
# LOG_DIR, ARCHIVE_DIR) and run stamps (RUN_DATE, RUN_TIMESTAMP) are computed
# by the loader and must not be set here.
#
# Deploy as: owner svc_etl_pipeline (or root), mode 0640.
# =============================================================================

# -- Teradata Connection -------------------------------------------------------
TD_SERVER=tdprod.corp.bankdemo.com
# TD_USERNAME may also come from the scheduler environment (default svc_etl_pipeline)
TD_USERNAME=svc_etl_pipeline
TD_LOGMECH=LDAP

# -- Database References -------------------------------------------------------
DB_CORE=CORE_BANKING_DB
DB_TXN=TXN_PROCESSING_DB
DB_STG=ETL_STAGING_DB
DB_DP=DATA_PRODUCTS_DB

# -- SAS Configuration ---------------------------------------------------------
SAS_HOME=/opt/SASHome/SASFoundation/9.4
SAS_CONFIG=/opt/SASHome/SASConfig/Lev1
SAS_AUTOEXEC=/opt/SASHome/SASConfig/Lev1/autoexec.sas

# -- Path Configuration --------------------------------------------------------
PIPELINE_HOME=/opt/etl/retail_banking_analytics

# -- Run Parameters ------------------------------------------------------------
LOOKBACK_MONTHS=12
RISK_SCORE_THRESHOLD=700

# -- Logging -------------------------------------------------------------------
LOG_LEVEL=INFO
