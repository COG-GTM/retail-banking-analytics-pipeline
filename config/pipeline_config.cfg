#!/bin/bash
# =============================================================================
# Pipeline Configuration - Retail Banking Customer Analytics
# =============================================================================
# Environment: DEV | UAT | PROD
# Last Updated: 2026-04-10
# =============================================================================

# -- Teradata Connection (LEGACY - retired by MBA-2203 / TICKET-02) -------------
# Host name, service account, auth mechanism and password are no longer held in
# source control. They are resolved at runtime from Azure Key Vault; call
# load_teradata_credentials before starting BTEQ or SAS. The Snowflake
# equivalents live in config/snowflake_config.cfg.
export KV_SECRET_TD_SERVER="teradata-server-host"
export KV_SECRET_TD_USERNAME="teradata-svc-etl-username"
export KV_SECRET_TD_LOGMECH="teradata-svc-etl-logmech"
export KV_SECRET_TD_PASSWORD="teradata-svc-etl-password"

load_teradata_credentials() {
    local cfg_dir
    cfg_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

    # shellcheck source=./snowflake_config.cfg
    source "${cfg_dir}/snowflake_config.cfg"
    # shellcheck source=../scripts/keyvault.sh
    source "${cfg_dir}/../scripts/keyvault.sh"

    kv_require_login || return 1

    TD_SERVER="$(kv_get_secret "${KV_SECRET_TD_SERVER}")"   || return 1
    TD_USERNAME="$(kv_get_secret "${KV_SECRET_TD_USERNAME}")" || return 1
    TD_LOGMECH="$(kv_get_secret "${KV_SECRET_TD_LOGMECH}")"  || return 1
    TD_PASSWORD="$(kv_get_secret "${KV_SECRET_TD_PASSWORD}")" || return 1
    export TD_SERVER TD_USERNAME TD_LOGMECH TD_PASSWORD
}

# -- Database References -------------------------------------------------------
export DB_CORE="CORE_BANKING_DB"          # Operational customer/account data
export DB_TXN="TXN_PROCESSING_DB"         # Transaction processing tables
export DB_STG="ETL_STAGING_DB"            # BTEQ staging/intermediate tables
export DB_DP="DATA_PRODUCTS_DB"           # Final certified data products

# -- SAS Configuration ---------------------------------------------------------
export SAS_HOME="/opt/SASHome/SASFoundation/9.4"
export SAS_CONFIG="/opt/SASHome/SASConfig/Lev1"
export SAS_BATCH="${SAS_HOME}/sas"
export SAS_AUTOEXEC="/opt/SASHome/SASConfig/Lev1/autoexec.sas"

# -- Path Configuration --------------------------------------------------------
export PIPELINE_HOME="/opt/etl/retail_banking_analytics"
export BTEQ_DIR="${PIPELINE_HOME}/bteq"
export SAS_DIR="${PIPELINE_HOME}/sas"
export LOG_DIR="${PIPELINE_HOME}/logs"
export ARCHIVE_DIR="${PIPELINE_HOME}/archive"

# -- Run Parameters ------------------------------------------------------------
export RUN_DATE=$(date +%Y%m%d)
export RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
export LOOKBACK_MONTHS=12
export RISK_SCORE_THRESHOLD=700

# -- Logging -------------------------------------------------------------------
export LOG_LEVEL="INFO"   # DEBUG | INFO | WARN | ERROR
