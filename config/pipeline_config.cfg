#!/bin/bash
# =============================================================================
# Pipeline Configuration - Retail Banking Customer Analytics
# =============================================================================
# Environment: DEV | UAT | PROD
# Last Updated: 2026-04-10
# =============================================================================

# -- Teradata Connection -------------------------------------------------------
export TD_SERVER="tdprod.corp.bankdemo.com"
export TD_USERNAME="${TD_USERNAME:-svc_etl_pipeline}"
export TD_LOGMECH="LDAP"

# Hosts the pipeline is permitted to log on to. TD_SERVER must be one of these.
TD_ALLOWED_SERVERS=("tdprod.corp.bankdemo.com")

# Variables that may be substituted into BTEQ scripts (envsubst SHELL-FORMAT).
export BTEQ_SUBST_VARS='${TD_SERVER} ${TD_USERNAME}'

# Logon fields are interpolated into BTEQ scripts before execution, so they
# must be single-token identifiers: no whitespace, newlines, or BTEQ/SQL
# metacharacters, and the host must be an allow-listed Teradata server.
validate_td_logon() {
    local host_re='^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$'
    local user_re='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
    local allowed=false
    local h

    if [[ ! "${TD_SERVER}" =~ ${host_re} ]]; then
        echo "ERROR: TD_SERVER contains invalid characters" >&2
        return 1
    fi
    for h in "${TD_ALLOWED_SERVERS[@]}"; do
        [[ "${TD_SERVER}" == "${h}" ]] && allowed=true
    done
    if [[ "${allowed}" != true ]]; then
        echo "ERROR: TD_SERVER '${TD_SERVER}' is not an allow-listed Teradata host" >&2
        return 1
    fi
    if [[ ! "${TD_USERNAME}" =~ ${user_re} ]]; then
        echo "ERROR: TD_USERNAME contains invalid characters" >&2
        return 1
    fi
    return 0
}

validate_td_logon || { return 1 2>/dev/null || exit 1; }

# -- Database References -------------------------------------------------------
export DB_CORE="CORE_BANKING_DB"          # Operational customer/account data
export DB_TXN="TXN_PROCESSING_DB"         # Transaction processing tables
export DB_STG="ETL_STAGING_DB"            # BTEQ staging/intermediate tables
export DB_DP="DATA_PRODUCTS_DB"           # Final certified data products

# -- SAS Configuration ---------------------------------------------------------
export SAS_HOME="/opt/SASHome/SASFoundation/9.4"
export SAS_CONFIG="/opt/SASHome/SASConfig/Lev1"
export SAS_BATCH="${SAS_HOME}/sas"
export SAS_AUTOEXEC="/opt/SASHome/SASConfig/Lev1/autoexec.sas"

# -- Path Configuration --------------------------------------------------------
export PIPELINE_HOME="/opt/etl/retail_banking_analytics"
export BTEQ_DIR="${PIPELINE_HOME}/bteq"
export SAS_DIR="${PIPELINE_HOME}/sas"
export LOG_DIR="${PIPELINE_HOME}/logs"
export ARCHIVE_DIR="${PIPELINE_HOME}/archive"

# -- Run Parameters ------------------------------------------------------------
export RUN_DATE=$(date +%Y%m%d)
export RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
export LOOKBACK_MONTHS=12
export RISK_SCORE_THRESHOLD=700

# -- Logging -------------------------------------------------------------------
export LOG_LEVEL="INFO"   # DEBUG | INFO | WARN | ERROR
