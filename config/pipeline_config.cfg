# =============================================================================
# Pipeline Configuration - Retail Banking Customer Analytics
# =============================================================================
# Environment: DEV | UAT | PROD
# Last Updated: 2026-04-10
#
# This file is DATA, not shell. It is parsed by config/load_pipeline_config.sh
# as plain KEY=VALUE lines; variable references and command substitution are
# rejected. Derived paths (BTEQ_DIR, SAS_DIR, LOG_DIR, ARCHIVE_DIR, SAS_BATCH)
# and run timestamps (RUN_DATE, RUN_TIMESTAMP) are computed by the loader.
# Keep this file owned by the pipeline service account with mode 0640 or 0600.
# =============================================================================

# -- Teradata Connection -------------------------------------------------------
TD_SERVER="tdprod.corp.bankdemo.com"
TD_USERNAME="svc_etl_pipeline"          # Overridden by TD_USERNAME in the environment if set
TD_LOGMECH="LDAP"

# -- Database References -------------------------------------------------------
DB_CORE="CORE_BANKING_DB"          # Operational customer/account data
DB_TXN="TXN_PROCESSING_DB"         # Transaction processing tables
DB_STG="ETL_STAGING_DB"            # BTEQ staging/intermediate tables
DB_DP="DATA_PRODUCTS_DB"           # Final certified data products

# -- SAS Configuration ---------------------------------------------------------
SAS_HOME="/opt/SASHome/SASFoundation/9.4"
SAS_CONFIG="/opt/SASHome/SASConfig/Lev1"
SAS_AUTOEXEC="/opt/SASHome/SASConfig/Lev1/autoexec.sas"

# -- Path Configuration --------------------------------------------------------
PIPELINE_HOME="/opt/etl/retail_banking_analytics"

# -- Run Parameters ------------------------------------------------------------
LOOKBACK_MONTHS=12
RISK_SCORE_THRESHOLD=700

# -- Logging -------------------------------------------------------------------
LOG_LEVEL="INFO"   # DEBUG | INFO | WARN | ERROR
