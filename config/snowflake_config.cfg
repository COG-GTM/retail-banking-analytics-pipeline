#!/bin/bash
# =============================================================================
# Snowflake / Azure Configuration - Retail Banking Customer Analytics
# Ticket: MBA-2203 (TICKET-02)
# =============================================================================
# Non-secret configuration only. Every credential is resolved at runtime from
# Azure Key Vault via scripts/keyvault.sh - this file holds Key Vault secret
# NAMES, never secret values.
#
# Environment: DEV | UAT | PROD  (override with SF_ENV before sourcing)
# =============================================================================

# -- Environment ---------------------------------------------------------------
export SF_ENV="${SF_ENV:-DEV}"

# -- Snowflake account ---------------------------------------------------------
export SF_ACCOUNT="${SF_ACCOUNT:-bankdemo-retail_analytics}"   # <org>-<account>
export SF_REGION="${SF_REGION:-east-us-2.azure}"
export SF_HOST="${SF_HOST:-${SF_ACCOUNT}.${SF_REGION}.snowflakecomputing.com}"

# -- Databases (created by TICKET-01 / MBA-2202) -------------------------------
export SF_DB_CORE="${SF_DB_CORE:-CORE_BANKING_DB}"      # operational customer/account data
export SF_DB_TXN="${SF_DB_TXN:-TXN_PROCESSING_DB}"      # transaction processing tables
export SF_DB_STG="${SF_DB_STG:-ETL_STAGING_DB}"         # staging/intermediate tables
export SF_DB_DP="${SF_DB_DP:-DATA_PRODUCTS_DB}"         # certified data products

# -- Warehouses ----------------------------------------------------------------
export SF_WH_ELT="WH_RB_ELT_${SF_ENV}"       # MEDIUM  - SQL transformations
export SF_WH_SPARK="WH_RB_SPARK_${SF_ENV}"   # LARGE   - Synapse Spark read/write
export SF_WH_ADHOC="WH_RB_ADHOC_${SF_ENV}"   # SMALL   - ad-hoc / BI

# -- Functional roles ----------------------------------------------------------
export SF_ROLE_LOADER="RB_LOADER_${SF_ENV}"
export SF_ROLE_TRANSFORMER="RB_TRANSFORMER_${SF_ENV}"
export SF_ROLE_ANALYST="RB_ANALYST_${SF_ENV}"
export SF_ROLE_ADMIN="RB_ADMIN_${SF_ENV}"

# -- Service principals --------------------------------------------------------
export SF_SVC_SYNAPSE_USER="SVC_SYNAPSE_SPARK_${SF_ENV}"
export SF_SVC_LOADER_USER="SVC_RB_LOADER_${SF_ENV}"
export SF_AUTHENTICATOR="${SF_AUTHENTICATOR:-SNOWFLAKE_JWT}"   # SNOWFLAKE_JWT | OAUTH

# -- Resource monitor credit quotas (monthly) ----------------------------------
export SF_QUOTA_ELT="${SF_QUOTA_ELT:-400}"
export SF_QUOTA_SPARK="${SF_QUOTA_SPARK:-800}"
export SF_QUOTA_ADHOC="${SF_QUOTA_ADHOC:-150}"

# -- Azure Key Vault -----------------------------------------------------------
# Secret NAMES only. Values are fetched at runtime by scripts/keyvault.sh.
export AZ_KEY_VAULT_NAME="${AZ_KEY_VAULT_NAME:-kv-retail-analytics-${SF_ENV,,}}"
export AZ_TENANT_ID="${AZ_TENANT_ID:-}"                  # injected by the Synapse managed identity
export KV_SECRET_SYNAPSE_PRIVATE_KEY="snowflake-svc-synapse-private-key"
export KV_SECRET_SYNAPSE_KEY_PASSPHRASE="snowflake-svc-synapse-key-passphrase"
export KV_SECRET_SYNAPSE_PUBLIC_KEY="snowflake-svc-synapse-public-key"
export KV_SECRET_LOADER_PRIVATE_KEY="snowflake-svc-loader-private-key"
export KV_SECRET_LOADER_KEY_PASSPHRASE="snowflake-svc-loader-key-passphrase"
export KV_SECRET_LOADER_PUBLIC_KEY="snowflake-svc-loader-public-key"
export KV_SECRET_ADMIN_PRIVATE_KEY="snowflake-svc-admin-private-key"
export KV_SECRET_ADMIN_KEY_PASSPHRASE="snowflake-svc-admin-key-passphrase"
export KV_SECRET_OAUTH_CLIENT_SECRET="snowflake-entra-oauth-client-secret"

# -- Azure Synapse -------------------------------------------------------------
export SYNAPSE_WORKSPACE="${SYNAPSE_WORKSPACE:-syn-retail-analytics-${SF_ENV,,}}"
export SYNAPSE_LINKED_SERVICE_SNOWFLAKE="LS_Snowflake_RetailAnalytics"
export SYNAPSE_LINKED_SERVICE_KEYVAULT="LS_AzureKeyVault_RetailAnalytics"

# -- Credential rotation -------------------------------------------------------
export SF_KEY_ROTATION_DAYS="${SF_KEY_ROTATION_DAYS:-90}"
